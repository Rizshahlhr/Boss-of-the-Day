workflows:
  android-build:
    name: Boss of the Day - Android
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project files
        script: |
          flutter create --platforms=android --org com.bossoftheday --project-name boss_of_the_day /tmp/proj
          cp -r /tmp/proj/android ./android
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
