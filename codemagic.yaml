workflows:
  android-build:
    name: Boss of the Day - Android
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project files
        script: |
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create --platforms=android --org com.bossoftheday --project-name boss_of_the_day .
          rm -rf lib && cp -r /tmp/lib_bak lib
          cp /tmp/pubspec_bak.yaml pubspec.yaml
      - name: Get packages
        script: flutter pub get
      - name: Build APK (test on your phone)
        script: flutter build apk --release
      - name: Build AAB (for Google Play)
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
